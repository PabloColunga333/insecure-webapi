server {
    listen 80;
    server_name 159.89.85.117;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 159.89.85.117;

    root /var/www/webapi;
    index index.php;

    ssl_certificate /etc/nginx/ssl/webapi/webapi.pem;
    ssl_certificate_key /etc/nginx/ssl/webapi/webapi-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/webapi_access.log;
    error_log /var/log/nginx/webapi_error.log;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(json|sql|md|txt|bak|old|backup|log|env|ini|conf)$ {
        deny all;
        return 403;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 403;
    }

    location ~* /(vendor|composer\.json|composer\.lock|tmp)/ {
        deny all;
        return 403;
    }
}
